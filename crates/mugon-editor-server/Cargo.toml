[package]
name = "mugon-editor-server"
version.workspace = true
edition.workspace = true

[dependencies]
mugon-editor-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8"
mime_guess = "2"
