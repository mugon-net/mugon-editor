[package]
name = "mugon-editor-bsn-check"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace: the path dependency below only exists in the monorepo, not in a mirror of libraries/mugon-editor.
[workspace]

# Compile + spawn test for the BSN source that `mugon-editor-scene` generates.
[dependencies]
mugon-sdk-bevy = { path = "../../../mugon-sdk-bevy", default-features = false, features = ["scene"] }
bevy = { version = "0.19", default-features = false, features = ["bevy_asset", "bevy_camera", "bevy_scene", "bevy_gltf", "bevy_log"] }
