# The editor is built and released by the GitHub Actions workflow of its mirror (see docs/ADRs/0006-release-sdks-cli-and-editor.md).
# Only what needs the rest of the monorepo runs here.
.mugon-editor-bsn-check-changes:
  rules:
    - changes:
        - libraries/mugon-editor/crates/mugon-editor-bsn-check/**/*
        - libraries/mugon-editor/crates/mugon-editor-scene/**/*
        - libraries/mugon-sdk-bevy/**/*

mugon-editor:bsn-check:
  stage: test
  image: rust:1
  needs: []
  rules: !reference [.mugon-editor-bsn-check-changes, rules]
  cache:
    key: mugon-editor-bsn-check-cargo
    paths:
      - libraries/mugon-editor/crates/mugon-editor-bsn-check/target/
      - .cargo-home/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  script:
    - cd libraries/mugon-editor/crates/mugon-editor-bsn-check
    - cargo test --locked
